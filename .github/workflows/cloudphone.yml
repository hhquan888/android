name: CloudPhone với Waydroid (scrcpy-web hoặc noVNC)

on:
  workflow_dispatch:
    inputs:
      viewer:
        description: 'Cách xem màn hình Android'
        required: true
        default: 'scrcpy'
        type: choice
        options:
          - 'scrcpy'
          - 'novnc'
      root:
        description: 'Bật root (adb root)?'
        required: true
        default: '0'
        type: choice
        options: ['0', '1']
      save_data:
        description: 'Lưu dữ liệu Waydroid qua các lần chạy?'
        required: true
        default: 'n'
        type: choice
        options: ['y', 'n']

jobs:
  cloudphone:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 350
    steps:
      - name: Khôi phục dữ liệu Waydroid lần trước (nếu bật lưu)
        if: ${{ github.event.inputs.save_data == 'y' }}
        uses: actions/cache@v4
        with:
          path: /var/lib/waydroid
          key: waydroid-data
          restore-keys: waydroid-data

      - name: Cài module kernel binder/ashmem (linux-modules-extra)
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r) || true
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo modprobe ashmem_linux || true
          lsmod | grep -E "binder|ashmem"

      - name: Cài công cụ nền (adb, weston, tunnel deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y android-tools-adb curl weston xwayland lxc python3-pip ca-certificates dbus-x11

      - name: Cài Waydroid
        run: |
          curl -s https://repo.waydro.id/ | sudo bash
          sudo apt-get update
          sudo apt-get install -y waydroid

      - name: Khởi tạo & khởi động container Waydroid
        run: |
          # Gói .deb waydroid tự start waydroid-container.service ngay lúc cài đặt
          # (trước khi có image nào) -> dừng nó để tránh state dở dang gây kẹt sau này
          sudo systemctl stop waydroid-container 2>/dev/null || true

          sudo waydroid init -s GAPPS -f || sudo waydroid init -f

          echo "----- kiểm tra device node binder thực tế -----"
          ls -la /dev/binder /dev/hwbinder /dev/vndbinder 2>&1 || echo "⚠️ Thiếu device node binder (xem lsmod ở bước trước)"

          # LƯU Ý: waydroid-container.service chỉ ĐĂNG KÝ dịch vụ DBus
          # "id.waydro.Container" rồi NGỒI CHỜ lệnh Start qua DBus.
          # Nó KHÔNG tự boot Android, nên "waydroid status" ở đây sẽ luôn
          # là Session: STOPPED cho tới khi "waydroid session start" (bước sau)
          # thực sự gọi vào DBus để yêu cầu container khởi động.
          # -> Ở bước này CHỈ cần đảm bảo service đang "active", KHÔNG chờ RUNNING.
          sudo systemctl enable waydroid-container 2>/dev/null || true
          sudo systemctl restart waydroid-container 2>/dev/null || true
          sleep 3

          if ! sudo systemctl is-active --quiet waydroid-container; then
            echo "::warning::waydroid-container.service KHÔNG active. Chẩn đoán:"
            sudo systemctl status waydroid-container --no-pager -l --full 2>&1 || true
            sudo journalctl -u waydroid-container --no-pager -n 300 2>/dev/null || true
            sudo journalctl -k --no-pager 2>/dev/null | grep -iE "apparmor|denied|cgroup|binder|lxc" | tail -80 || true
            exit 1
          fi

          echo "✅ waydroid-container.service đang active (container sẽ boot thật khi 'session start' được gọi ở bước sau)"
          sudo waydroid status || true

      - name: Khởi động Weston headless (compositor host bắt buộc cho Waydroid)
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          sudo mkdir -p "$XDG_RUNTIME_DIR"
          sudo chown "$(id -u):$(id -g)" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          weston --backend=headless-backend.so --width=720 --height=1280 --idle-time=0 > /tmp/weston.log 2>&1 &
          disown
          sleep 5

      - name: Khởi động phiên Waydroid + bật ADB qua TCP
        run: |
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"

          # Điều kiện ĐÚNG để tiếp tục là service container đang active
          # (KHÔNG phải Session==RUNNING — trạng thái đó chỉ có SAU khi
          # session start thực sự gọi container khởi động qua DBus)
          if ! sudo systemctl is-active --quiet waydroid-container; then
            echo "::error::waydroid-container.service KHÔNG active — xem log bước trước để chẩn đoán."
            exit 1
          fi

          # Waydroid cấu hình LXC bind-mount $XDG_RUNTIME_DIR/pulse/native vào container
          # để forward audio. Runner headless không có PulseAudio/PipeWire session nào
          # chạy thật (pipewire-pulse dù có sẵn cũng cần pipewire+wireplumber chạy trước,
          # không đáng tin cậy trên CI) -> lxc-start fail ngay ở bước mount
          # ("Failed to setup mount entries"). CloudPhone này chỉ cần điều khiển màn hình
          # qua scrcpy-web/noVNC, không cần audio, nên chỉ cần tạo 1 file rỗng đúng path
          # để bind-mount có nguồn hợp lệ mà không cần audio server thật nào cả.
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          mkdir -p "$XDG_RUNTIME_DIR/pulse"
          touch "$XDG_RUNTIME_DIR/pulse/native"

          nohup waydroid session start > /tmp/waydroid-session.log 2>&1 &
          disown

          echo "Chờ container thực sự vào trạng thái RUNNING (session start sẽ trigger việc này)..."
          STATE=""
          for i in $(seq 1 40); do
            STATE=$(sudo waydroid status 2>/dev/null | grep -i "^Session" | awk '{print $NF}')
            echo "  ($i/40) trạng thái session: ${STATE:-<chưa có>}"
            [ "$STATE" = "RUNNING" ] && break
            sleep 3
          done

          echo "----- log waydroid-session -----"
          cat /tmp/waydroid-session.log 2>/dev/null || true

          if [ "$STATE" != "RUNNING" ]; then
            echo "::warning::Vẫn KHÔNG vào RUNNING sau ~120s. Chẩn đoán chi tiết:"
            sudo cat /var/lib/waydroid/waydroid.log 2>/dev/null || echo "(waydroid.log rỗng)"
            sudo journalctl -u waydroid-container --no-pager -n 100 2>/dev/null || true
            sudo lxc-info -P /var/lib/waydroid/lxc -n waydroid -sH 2>&1 || true
            sudo journalctl -k --no-pager 2>/dev/null | grep -iE "apparmor|denied|cgroup|binder|lxc" | tail -80 || true
            exit 1
          fi

          waydroid prop set persist.waydroid.multi_windows false || true
          adb start-server
          for i in $(seq 1 20); do
            IP=$(waydroid status 2>/dev/null | grep -i "IP address" | awk '{print $NF}')
            [ -n "$IP" ] && break
            sleep 3
          done
          IP="${IP:-192.168.240.112}"
          echo "WAYDROID_IP=$IP" >> "$GITHUB_ENV"
          adb connect "$IP:5555" || true
          adb devices -l

      - name: Chờ Android boot hoàn tất
        run: |
          for i in $(seq 1 30); do
            BOOTED=$(adb -s "$WAYDROID_IP:5555" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BOOTED" = "1" ] && echo "✅ Boot xong" && break
            echo "Đợi boot... ($i/30)"; sleep 10
          done

      - name: Bật root (nếu chọn root=1)
        if: ${{ github.event.inputs.root == '1' }}
        run: |
          adb -s "$WAYDROID_IP:5555" root || true
          sleep 3
          adb connect "$WAYDROID_IP:5555" || true

      - name: Cài trình duyệt Brave (bản arm64 gốc, v1.93.132)
        run: |
          if adb -s "$WAYDROID_IP:5555" shell pm list packages | grep -qE "chrome|firefox|org.mozilla|brave|com.brave"; then
            echo "✅ Đã có trình duyệt cài sẵn, bỏ qua."
          else
            echo "📥 Tải Brave APK bản arm64 gốc..."
            BRAVE_URL="https://github.com/brave/brave-browser/releases/download/v1.93.132/Bravearm64Universal.apk"
            curl -L "$BRAVE_URL" -o brave.apk
            echo "sha256 file tải về: $(sha256sum brave.apk | awk '{print $1}')"
            file brave.apk
            adb -s "$WAYDROID_IP:5555" install -r brave.apk && echo "✅ Brave installed" || echo "⚠️ Cài thất bại, xem log ở trên."
          fi

      # ---------------- VIEWER: scrcpy-web (ws-scrcpy) ----------------
      - name: "[scrcpy] Tải ws-scrcpy custom build sẵn"
        if: ${{ github.event.inputs.viewer == 'scrcpy' }}
        run: |
          mkdir -p ws-scrcpy-build
          curl -L "https://github.com/hhquan888/ws-scrcpy/releases/download/1.0/ws-scrcpy-dist.zip" -o ws-scrcpy-dist.zip
          unzip -o ws-scrcpy-dist.zip -d ws-scrcpy-build
          cat > ws-scrcpy-build/Dockerfile <<'EOF'
          FROM node:18-slim
          RUN apt-get update && apt-get install -y android-tools-adb curl python3 make g++ && rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          COPY . .
          RUN npm install --omit=dev --no-audit --no-fund
          EXPOSE 8000
          CMD ["npm", "start"]
          EOF

      - name: "[scrcpy] Build & chạy ws-scrcpy (nối vào Waydroid qua ADB TCP)"
        if: ${{ github.event.inputs.viewer == 'scrcpy' }}
        run: |
          docker build -t custom-ws-scrcpy ./ws-scrcpy-build
          docker run -d --name custom-ws-scrcpy --network host \
            custom-ws-scrcpy \
            sh -c "adb start-server && adb connect ${WAYDROID_IP}:5555 && npm start"
          sleep 10
          docker logs custom-ws-scrcpy | tail -n 50

      # ---------------- VIEWER: noVNC (Xwayland + x11vnc) ----------------
      - name: "[novnc] Cài x11vnc + noVNC + websockify"
        if: ${{ github.event.inputs.viewer == 'novnc' }}
        run: |
          sudo apt-get install -y x11vnc novnc websockify

      - name: "[novnc] Xwayland bọc Weston, phát ra VNC"
        if: ${{ github.event.inputs.viewer == 'novnc' }}
        run: |
          export DISPLAY=:0
          Xwayland :0 &
          sleep 3
          x11vnc -display :0 -nopw -forever -shared -rfbport 5900 -bg -o /tmp/x11vnc.log
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &
          sleep 3

      # ---------------- Upload server (chung cho cả 2 viewer) ----------------
      - name: Cài upload server đơn giản (push file vào /sdcard)
        run: |
          mkdir -p uploads && sudo chmod 777 uploads
          mkdir -p upload-server && cd upload-server
          npm init -y >/dev/null 2>&1
          npm install express multer >/dev/null 2>&1
          cat > server.js <<JSEOF
          const express = require('express');
          const multer = require('multer');
          const { execFile } = require('child_process');
          const path = require('path');
          const app = express();
          const upload = multer({ dest: path.join(__dirname, '../uploads') });
          const WAYDROID_TARGET = '${WAYDROID_IP}:5555';
          app.get('/', (req, res) => {
            res.send('<html><body style="font-family:sans-serif;padding:20px"><h2>Upload file vào Waydroid</h2><form method="POST" action="/upload" enctype="multipart/form-data"><input type="file" name="files" multiple /><button type="submit">Upload</button></form></body></html>');
          });
          app.post('/upload', upload.array('files'), (req, res) => {
            const files = req.files || [];
            if (files.length === 0) return res.json({ success: false });
            let done = 0; const results = [];
            files.forEach((f) => {
              const dest = '/sdcard/Download/' + f.originalname;
              execFile('adb', ['-s', WAYDROID_TARGET, 'push', f.path, dest], (err) => {
                results.push({ file: f.originalname, success: !err });
                done++;
                if (done === files.length) res.json({ success: results.every(r => r.success), results });
              });
            });
          });
          app.listen(3000, () => console.log('Upload server chạy tại port 3000'));
          JSEOF
          cd ..
          nohup node upload-server/server.js > upload-server.log 2>&1 &
          disown
          sleep 5

      - name: Cài & chạy Cloudflare Tunnel (có watchdog)
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          > cloudflared.log
          > cloudflared-upload.log

          if [ "${{ github.event.inputs.viewer }}" = "scrcpy" ]; then
            MAIN_PORT=8000
          else
            MAIN_PORT=6080
          fi
          echo "MAIN_PORT=$MAIN_PORT" >> "$GITHUB_ENV"

          nohup cloudflared tunnel --url "http://localhost:${MAIN_PORT}" >> cloudflared.log 2>&1 &
          disown
          nohup cloudflared tunnel --url http://localhost:3000 >> cloudflared-upload.log 2>&1 &
          disown

          for i in $(seq 1 20); do
            sleep 3
            URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' cloudflared.log | head -n1 || true)
            [ -n "$URL" ] && echo "TUNNEL_URL=$URL" >> "$GITHUB_ENV" && break
          done
          for i in $(seq 1 20); do
            sleep 2
            UPLOAD_URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' cloudflared-upload.log | head -n1 || true)
            [ -n "$UPLOAD_URL" ] && echo "UPLOAD_URL=$UPLOAD_URL" >> "$GITHUB_ENV" && break
          done

          nohup bash -c "
            while true; do
              sleep 15
              pgrep -f \"cloudflared tunnel --url http://localhost:${MAIN_PORT}\" > /dev/null || nohup cloudflared tunnel --url http://localhost:${MAIN_PORT} >> cloudflared.log 2>&1 &
              pgrep -f 'cloudflared tunnel --url http://localhost:3000' > /dev/null || nohup cloudflared tunnel --url http://localhost:3000 >> cloudflared-upload.log 2>&1 &
            done
          " > cloudflared-watchdog.log 2>&1 &
          disown

      - name: In hướng dẫn sử dụng
        run: |
          echo "=========================================="
          echo "📱 Viewer đang dùng: ${{ github.event.inputs.viewer }}"
          if [ "${{ github.event.inputs.viewer }}" = "novnc" ]; then
            echo "🖥  Truy cập: ${TUNNEL_URL}/vnc.html"
          else
            echo "🖥  Truy cập: ${TUNNEL_URL}"
          fi
          echo "📤 Upload file: ${UPLOAD_URL}"
          echo "🔧 Root: ${{ github.event.inputs.root }} | IP Waydroid: ${WAYDROID_IP}"
          echo "=========================================="

      - name: Giữ job chạy 340 phút
        run: |
          END=$((SECONDS + 340*60))
          while [ $SECONDS -lt $END ]; do
            sleep 60
            echo "alive $(date)"
          done
